[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only `app` is a distributable package; `tests` and `alembic` sit alongside it
# and must be excluded or setuptools' auto-discovery refuses to build.
packages = ["app"]

[project]
name = "xagent-backend"
version = "0.2.0"
description = "Agentic X/Twitter account intelligence — backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "typer>=0.13.0",
    "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Audit action names such as PASSWORD_CHANGED trip the hardcoded-password
# heuristic. They are enum members, not credentials.
"app/models/enums.py" = ["S105"]
# Migrations are generated and their long column definitions read better
# unwrapped than folded.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true

# Celery ships no type information for its task decorator, so every task would
# otherwise be reported as untyped. Scoped narrowly rather than relaxing strict
# mode across the project.
[[tool.mypy.overrides]]
module = "app.worker.tasks"
disallow_untyped_decorators = false
