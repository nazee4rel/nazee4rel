# Checks that used to depend on someone remembering to run them.
#
# The backend job runs the suite twice on purpose. The first pass has no
# services attached, which is what proves `pytest` still works as a no-setup
# command — the suite pins XAGENT_ENV_FILE at a path that does not exist and
# points REDIS_URL at an unreachable port precisely so it cannot drift into
# depending on ambient infrastructure. The second pass adds PostgreSQL, which
# is the only way the 12 tests in tests/test_postgres.py execute at all: the
# migrations, JSONB, timezone-aware datetimes, concurrent constraint
# arbitration, and the worker's event-loop isolation. Those skip silently
# otherwise, and a silent skip is how a green build lies.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xagent_test
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails on a
        # connection refused that has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy app

      - name: Tests (SQLite, no services)
        run: pytest -q

      - name: Tests (PostgreSQL)
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/xagent_test
        run: pytest -q

      - name: Fail if the PostgreSQL tests skipped
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/xagent_test
        # The step above passes just as happily when every Postgres test skips,
        # which is the failure this whole service container exists to prevent.
        run: pytest tests/test_postgres.py -q --no-header | tee /dev/stderr | grep -qE '[0-9]+ passed'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # Also proves the standalone output the production image copies from is
        # still being produced.
        run: npm run build
